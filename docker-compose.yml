services:
  postgres:
    image: postgres:16-alpine
    container_name: animals-postgres
    environment:
      POSTGRES_DB: animals
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d animals"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
